<script>
/* Pre-paint mode resolution: visitor override -> config default -> OS.
   Runs before the stylesheet so there is no flash of the wrong mode. The
   worker stamps data-theme-default on <html> and HTMLRewriter streams the
   document top-down, so the attribute is present by the time this runs. */
(function () {
  var d = document.documentElement, s = null;
  try { s = localStorage.getItem('ol-theme'); } catch (e) {}
  var def = d.getAttribute('data-theme-default') || 'midnight';
  var light = s ? s === 'light'
    : def === 'auto' ? matchMedia('(prefers-color-scheme: light)').matches
    : def === 'daylight';
  if (light) d.setAttribute('data-theme', 'light');
})();
</script>

/* ============================================
   theARCHIVE — PAGE-SPECIFIC STYLES
   ============================================ */

/* ---- ARCHIVE HEADER ---- */

.archive-header {
  max-width: 1400px;
  margin: 0 auto;
  padding: 48px 40px 0;
}

.archive-tagline {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(1.1rem, 2.2vw, 1.6rem);
  color: var(--white);
  margin-bottom: 6px;
}

.archive-tagline .section-mark {
  color: var(--red);
  margin-right: 8px;
}

/* ---- ROLLING BUFFER STRIP ---- */

.buffer-strip {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px 40px 0;
}

.buffer-strip-inner {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 16px;
  border: 1px solid var(--gray-800);
  background: var(--gray-900);
  transition: border-color 0.3s ease, background 0.3s ease;
  cursor: pointer;
  max-width: 520px;
}

.buffer-strip-inner:hover {
  border-color: var(--gray-700);
  background: rgba(255, 255, 255, 0.015);
}

.buffer-thumb {
  width: 56px;
  height: 38px;
  object-fit: cover;
  background: #111;
  border: 1px solid var(--gray-800);
  flex-shrink: 0;
  transition: border-color 0.2s ease;
}

.buffer-strip-inner:hover .buffer-thumb {
  border-color: var(--gray-700);
}

.buffer-strip-data {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
  min-width: 0;
}

.buffer-strip-label {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 1.5px;
  color: var(--gray-300);
  text-transform: uppercase;
  transition: color 0.2s ease;
}

.buffer-strip-inner:hover .buffer-strip-label {
  color: var(--white);
}

.buffer-strip-meta {
  font-family: var(--font-mono);
  font-size: 0.55rem;
  letter-spacing: 1.5px;
  color: var(--gray-500);
  text-transform: uppercase;
}

.buffer-strip-arrow {
  font-size: 0.7rem;
  color: var(--gray-700);
  transition: color 0.2s ease, transform 0.2s ease;
  flex-shrink: 0;
}

.buffer-strip-inner:hover .buffer-strip-arrow {
  color: var(--red);
  transform: translateX(3px);
}

/* ---- ARCHIVE GRID ---- */

.archive-grid-wrap {
  max-width: 1400px;
  margin: 0 auto;
  padding: 40px 40px 80px;
}

.archive-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px 24px;
}

/* ---- ARCHIVE CARD ---- */

.archive-card {
  display: flex;
  flex-direction: column;
  cursor: pointer;
}

.archive-card-img-wrap {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  background: #0a0a0a;
  margin-bottom: 12px;
}

.archive-card-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.5s ease, filter 0.5s ease;
}

.archive-card:hover .archive-card-img {
  transform: scale(1.025);
}

/* Desaturate sibling cards — JS adds .is-hovering to grid, .is-active to hovered card */
.archive-grid.is-hovering .archive-card:not(.is-active) .archive-card-img {
  filter: saturate(0.12) brightness(0.88);
  transition: filter 0.4s ease, transform 0.5s ease;
}

/* Fade the tag text and red pipes on non-hovered cards */
.archive-grid.is-hovering .archive-card:not(.is-active) .archive-card-tag {
  opacity: 0.45;
  transition: opacity 0.4s ease;
}

.archive-card-tag {
  display: flex;
  flex-direction: column;
  gap: 3px;
  transition: opacity 0.4s ease;
}

.archive-card-title {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  color: var(--white-bright);
  text-transform: none;
  line-height: 1.3;
  letter-spacing: 0.3px;
  transition: color 0.2s ease;
}

.archive-card:hover .archive-card-title {
  color: var(--white-bright);
}

.archive-card-sub {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--gray-300);
  letter-spacing: 0.5px;
  line-height: 1.3;
}

.archive-card-location {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--gray-300);
  letter-spacing: 0.5px;
}

.archive-card-meta {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  letter-spacing: 0.8px;
  color: var(--gray-500);
  margin-top: 4px;
}

.archive-card-meta .pipe {
  color: var(--red);
  margin: 0 4px;
  opacity: 0.6;
}

/* Hash line — barely there */
.archive-card-hash {
  font-family: var(--font-mono);
  font-size: 0.5rem;
  letter-spacing: 1px;
  color: var(--gray-800);
  margin-top: 3px;
  transition: color 0.3s ease;
}

.archive-card:hover .archive-card-hash {
  color: var(--gray-700);
}

/* ---- ARCHIVE FOOTER COUNT ---- */

.archive-count-line {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 40px 60px;
  font-family: var(--font-mono);
  font-size: 0.55rem;
  letter-spacing: 2.5px;
  color: var(--gray-700);
  text-transform: uppercase;
  border-top: 1px solid var(--gray-800);
  padding-top: 20px;
}

.archive-count-line .accent {
  color: var(--red);
}

/* ---- MOBILE ONE-TIME HINT ---- */
/* Ghostly, self-dismissing nudge shown once per device so mobile visitors
   realize the full-viewport thumbnails open to the full frame. Bare floating
   text — no background, shadow, or radius. */
.archive-hint {
  position: fixed;
  left: 50%;
  bottom: calc(54px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 150;
  font-family: var(--font-mono);
  font-size: 0.6rem;
  letter-spacing: 1.5px;
  color: var(--gray-500);
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.45s ease;
}

.archive-hint.is-visible {
  opacity: 1;
}

/* ---- RESPONSIVE ---- */

@media (max-width: 1100px) {
  .archive-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 900px) {
  .archive-header {
    padding: 32px 16px 0;
  }

  .buffer-strip {
    padding: 16px 16px 0;
  }

  .buffer-strip-inner {
    max-width: 100%;
  }

  .archive-grid-wrap {
    padding: 28px 16px 60px;
  }

  .archive-grid {
    grid-template-columns: 1fr;
    gap: 28px;
  }

  .archive-card-title {
    font-size: 0.78rem;
  }

  .archive-count-line {
    padding: 0 16px 40px;
    padding-top: 16px;
  }
}

@media (max-width: 560px) {
  .archive-card-img-wrap {
    aspect-ratio: 4 / 3;
  }
}

/* ---- LIGHTBOX ---- */

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(0, 0, 0, 0.95);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
  cursor: zoom-out;
  padding: 40px;
}

.lightbox.is-open {
  opacity: 1;
  visibility: visible;
}

.lightbox-img {
  max-width: 100%;
  max-height: 72vh;
  object-fit: contain;
  margin-bottom: 20px;
  box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
}

.lightbox-tag {
  text-align: center;
  max-width: 600px;
}

.lightbox-title {
  font-family: var(--font-mono);
  font-size: 0.88rem;
  color: var(--white-bright);
  letter-spacing: 0.3px;
  margin-bottom: 4px;
}

.lightbox-sub {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--gray-300);
  margin-bottom: 4px;
}

.lightbox-location {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--gray-300);
  margin-bottom: 6px;
}

.lightbox-meta {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  color: var(--gray-500);
}

.lightbox-meta .pipe {
  color: var(--red);
  margin: 0 4px;
  opacity: 0.6;
}

.lightbox-hash {
  font-family: var(--font-mono);
  font-size: 0.5rem;
  color: var(--gray-800);
  margin-top: 4px;
}

.lightbox-close {
  position: absolute;
  top: 20px;
  right: 24px;
  background: none;
  border: none;
  color: var(--gray-500);
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 2px;
  cursor: pointer;
  padding: 8px;
  transition: color 0.2s ease;
}

.lightbox-close:hover {
  color: var(--white);
}

@media (max-width: 900px) {
  .lightbox {
    padding: 20px;
  }

  .lightbox-img {
    max-height: 60vh;
  }
}
</style>
</head>
