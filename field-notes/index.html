<script>
/* Pre-paint mode resolution: visitor override -> config default -> OS.
   Runs before the stylesheet so there is no flash of the wrong mode. The
   worker stamps data-theme-default on <html> and HTMLRewriter streams the
   document top-down, so the attribute is present by the time this runs. */
(function () {
  var d = document.documentElement, s = null;
  try { s = localStorage.getItem('ol-theme'); } catch (e) {}
  var def = d.getAttribute('data-theme-default') || 'midnight';
  var light = s ? s === 'light'
    : def === 'auto' ? matchMedia('(prefers-color-scheme: light)').matches
    : def === 'daylight';
  if (light) d.setAttribute('data-theme', 'light');
})();
</script>

/* ============================================
   FN//BLOG — LISTING PAGE
   ============================================ */

.fn-header {
  max-width: 900px;
  margin: 0 auto;
  padding: 48px 40px 0;
}

.fn-title {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.4rem;
  color: var(--white-bright);
  letter-spacing: 1px;
  margin-bottom: 4px;
}

.fn-title .accent { color: var(--red); }

.fn-subtitle {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  letter-spacing: 2.5px;
  color: var(--gray-500);
  text-transform: uppercase;
}

/* ---- POST LIST ---- */

.fn-list {
  max-width: 900px;
  margin: 0 auto;
  padding: 40px 40px 80px;
}

.fn-entry {
  display: flex;
  gap: 20px;
  padding: 24px 0;
  border-bottom: 1px solid var(--gray-800);
  transition: background 0.2s ease;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}

.fn-entry:first-child {
  border-top: 1px solid var(--gray-800);
}

.fn-entry:hover {
  background: rgba(255, 255, 255, 0.01);
}

/* Hero thumbnail */
.fn-entry-thumb {
  flex-shrink: 0;
  width: 140px;
  height: 94px;
  object-fit: cover;
  background: var(--gray-900);
  border: 1px solid var(--gray-800);
}

.fn-entry-thumb.no-hero {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.55rem;
  color: var(--gray-700);
  letter-spacing: 1.5px;
}

.fn-entry-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.fn-entry-id {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  letter-spacing: 2px;
  color: var(--red);
  text-transform: uppercase;
  opacity: 0.8;
}

.fn-entry-name {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  color: var(--white-bright);
  line-height: 1.3;
  transition: color 0.2s ease;
}

.fn-entry:hover .fn-entry-name {
  color: var(--white);
}

.fn-entry-meta {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  letter-spacing: 1.5px;
  color: var(--gray-500);
  text-transform: uppercase;
}

.fn-entry-meta .sep {
  color: var(--gray-700);
  margin: 0 6px;
}

/* ---- COUNT ---- */

.fn-count {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 40px 60px;
  font-family: var(--font-mono);
  font-size: 0.55rem;
  letter-spacing: 2.5px;
  color: var(--gray-700);
  text-transform: uppercase;
  border-top: 1px solid var(--gray-800);
  padding-top: 20px;
}

.fn-count .accent { color: var(--red); }

/* ---- RESPONSIVE ---- */

@media (max-width: 900px) {
  .fn-header { padding: 32px 16px 0; }
  .fn-list { padding: 28px 16px 60px; }

  .fn-entry {
    flex-direction: column;
    gap: 12px;
  }

  .fn-entry-thumb {
    width: 100%;
    height: 180px;
  }

  .fn-count { padding: 0 16px 40px; padding-top: 16px; }
}
</style>
