<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title data-site-title>Card</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" as="font" type="font/woff2" href="/fonts/syne-latin-var.woff2" crossorigin data-font-preload>
<script>
/* Pre-paint mode resolution: visitor override -> config default -> OS.
   Runs before the stylesheet so there is no flash of the wrong mode. The
   worker stamps data-theme-default on <html> and HTMLRewriter streams the
   document top-down, so the attribute is present by the time this runs. */
(function () {
  var d = document.documentElement, s = null;
  try { s = localStorage.getItem('ol-theme'); } catch (e) {}
  var def = d.getAttribute('data-theme-default') || 'midnight';
  var light = s ? s === 'light'
    : def === 'auto' ? matchMedia('(prefers-color-scheme: light)').matches
    : def === 'daylight';
  if (light) d.setAttribute('data-theme', 'light');
})();
</script>
<!-- ROOT-RELATIVE, unlike every other page's `../css/main.css`. This is the
     only page whose served path VARIES in depth — /card/<id> and /card/<id>/
     are the same address — so a document-relative href is correct for exactly
     one of them and resolves to /card/css/main.css for the other. Root-relative
     is right for both, and the exporter rewrites it for file:// the way it
     already does for 404.html. -->
<link rel="stylesheet" href="/css/main.css?v=41">
<script src="/js/mode-toggle.js?v=1" defer></script>
<link rel="sitemap" type="application/xml" href="/sitemap.xml">
<!-- No static og:/twitter: block here on purpose, same reasoning as /listen:
     the worker resolves the card from the path and injects exactly one block
     (see getCardOgData). A static set would duplicate og:title, and crawlers
     take the first tag they find. -->
<style>
/* ============================================
   CARD — one composed card at its own address
   The share target for a card the owner composed. The card itself is drawn by
   js/recent-index.js, exactly as the homepage draws it — this file only lays
   out the page around it, at the card's native 4:5 and nothing else.
   ============================================ */

.cardp-wrap {
  max-width: 780px;
  margin: 0 auto;
  padding: 64px 26px 120px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* The card at its native proportion. The homepage sizes it by grid column;
   here there is no grid, so the width is capped and centred and the 4:5 comes
   from .wk-img as it does everywhere else. */
.cardp-card {
  width: 100%;
  max-width: 380px;
}

/* A card on the homepage sits in a row of three and is read at a glance. On
   its own page it is the whole point, so the pointer affordance only makes
   sense when it actually goes somewhere. */
.cardp-card .wk-card:not(a) {
  cursor: default;
}

/* The link-through, when the card has one. Below the card rather than on it:
   the card may already be an anchor, and a second target inside the first is
   a trap on touch. */
.cardp-through {
  margin-top: 22px;
  font-family: var(--font-meta);
  font-size: 0.72rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  text-decoration: none;
  border-bottom: 1px solid var(--line);
  padding-bottom: 3px;
  transition: color 0.15s, border-color 0.15s;
}
.cardp-through:hover {
  color: var(--fg-strong);
  border-color: var(--accent);
}

/* Nothing at this address. Not an error page — a card that was never composed,
   or a link typed wrong. Says so plainly and points home. */
.cardp-empty {
  font-family: var(--font-meta);
  font-size: 0.78rem;
  letter-spacing: 0.06em;
  color: var(--muted);
  text-align: center;
  padding: 60px 0;
  line-height: 1.9;
}
.cardp-empty a {
  color: var(--accent-text);
  text-decoration: none;
  border-bottom: 1px solid var(--line);
}

@media (max-width: 640px) {
  .cardp-wrap { padding: 40px 20px 110px; }
}
</style>
</head>
<body>
